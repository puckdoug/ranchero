[package]
name = "zwift-worlds"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Zwift world-meta tables and position projection (port of sauce4zwift's env.mjs worldMetas + webMercatorProjection)."

[lib]
doctest = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
approx = "0.5"
