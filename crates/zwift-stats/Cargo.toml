[package]
name = "zwift-stats"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Zwift stats engine: rolling windows, power/heart-rate/speed metrics, W' balance, zones."

[dependencies]
thiserror = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
approx = "0.5"
