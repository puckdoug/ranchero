<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ranchero — Watching</title>
<link rel="stylesheet" href="/pages/main.css">
</head>
<body>
<header><a href="/">Ranchero</a> — <strong>Watching</strong></header>
<main id="stats">
  <div class="stat" id="power">   <span class="val">—</span><span class="lbl">W</span></div>
  <div class="stat" id="hr">      <span class="val">—</span><span class="lbl">bpm</span></div>
  <div class="stat" id="speed">   <span class="val">—</span><span class="lbl">km/h</span></div>
  <div class="stat" id="np">      <span class="val">—</span><span class="lbl">NP</span></div>
  <div class="stat" id="tss">     <span class="val">—</span><span class="lbl">TSS</span></div>
  <div class="stat" id="wbal">    <span class="val">—</span><span class="lbl">W′bal</span></div>
</main>
<script type="module" src="/pages/watching.mjs"></script>
